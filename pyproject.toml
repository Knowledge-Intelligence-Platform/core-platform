# Tooling configuration only.
#
# Runtime dependencies live in requirements.txt, which is what the Dockerfile and
# the local setup in README.md install. They are deliberately not duplicated here.

[project]
name = "knowledge-intelligence"
version = "0.1.0"
description = "Core Knowledge Intelligence Platform runtime"
readme = "README.md"
requires-python = ">=3.14"

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "boto3-stubs[s3,bedrock-agent,bedrock-agent-runtime]>=1.43.77,<2.0",
    "mypy>=1.14,<2.0",
    "ruff>=0.9,<1.0",
    "pytest>=8.3,<10.0",
    "pyyaml>=6.0,<7.0",
    "types-pyyaml>=6.0,<7.0",
    # Used only by scripts/evaluate.py; deliberately not in requirements.txt so
    # the container image does not ship the evaluation harness.
    "strands-agents-evals>=1.1,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["app", "scripts"]

# strands_evals ships no py.typed marker, so its symbols are Any to mypy.
# Scope the relaxation to the evaluation script only; app/ stays fully strict.
[[tool.mypy.overrides]]
module = "strands_evals.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scripts.evaluate"
disallow_subclassing_any = false
disallow_untyped_decorators = false
