<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="title description">
<title id="title">Core Platform — implemented architecture</title><desc id="description">Two flows: approved sources are parsed, chunked and embedded into S3 Vectors and an S3 chunk store. Questions enter FastAPI, retrieve passages with hybrid search before a single Strands agent, and pass an enforced answer contract. Slack coverage requests bypass the model. OpenAI is implemented; Bedrock and direct Confluence connections are planned.</desc>
