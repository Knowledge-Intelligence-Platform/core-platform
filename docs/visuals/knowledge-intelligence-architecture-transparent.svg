<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="Knowledge Intelligence Platform architecture. Confluence PDF exports, GitHub README files and the service registry are parsed, chunked, embedded and indexed. Vectors go to an S3 Vectors index and the parsed text to a separate S3 chunk store. A question from Slack passes through the REST API to run hybrid retrieval, semantic and keyword, taking twenty-five candidates from each side and fusing them to five passages. The Platform Knowledge Agent answers only from those passages, and refuses when they do not cover the question.">
