  <text x="62" y="1158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#B45309">Contacts are never indexed — the registry supplies them as the reply is sent.</text>
  <text x="62" y="1192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#B45309">Nothing relevant found? It says it does not know, rather than guessing.</text>
