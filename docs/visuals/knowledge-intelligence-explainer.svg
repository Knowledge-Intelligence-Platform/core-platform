<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 1246" width="1760" height="1246" role="img" aria-label="How the platform works end to end. First, getting knowledge in: Confluence PDFs, GitHub READMEs and the component registry are parsed into plain text, split into passages, and embedded as numbers. Second, what is stored: the passage text in a chunk store, the numbers in a vector index, and the live registry delivered by AppConfig from the team's own registry repository. Third, answering a question: someone asks in their own words, hybrid search combines meaning and exact words against both stores, the best few passages are the only thing the model is given, the agent answers from those alone, and the reply goes back to Slack with a diagram and a contact. Contacts are never indexed, and when nothing relevant is found the agent says it does not know rather than guessing.">
  <defs>
    <marker id="sky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0369A1"/></marker>
    <marker id="slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4338CA"/></marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B45309"/></marker>
  </defs>
