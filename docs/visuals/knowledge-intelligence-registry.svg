  <path d="M1220 420.0 C 1290 420.0, 1350 280, 1406 280" fill="none" stroke="#6366F1" stroke-width="2.2" marker-end="url(#i)"/>
  <path d="M1220 640.0 C 1290 640.0, 1350 280, 1406 280" fill="none" stroke="#6366F1" stroke-width="2.2" marker-end="url(#i)"/>
  <path d="M1220 860.0 C 1290 860.0, 1350 815, 1406 815" fill="none" stroke="#D97706" stroke-width="2.2" marker-end="url(#a)"/>
  <path d="M1640.0 590 V 642" fill="none" stroke="#6366F1" stroke-width="2.2" marker-end="url(#i)"/>
