<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 864" width="1760" height="864" role="img" aria-label="How multi-tenancy works. One codebase: the same software is deployed once per team. Each team — the Intelligence Platform, TME, and any team joining next — gets its own chat bot, its own documents, its own search index, and its own running service, plus its own registry that the team edits itself. Nothing crosses between teams: each copy only ever knows about its own.">
