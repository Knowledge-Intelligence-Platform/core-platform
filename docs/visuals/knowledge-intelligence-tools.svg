<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1762 732" width="1762" height="732" role="img" aria-label="Tools and framework. Agent and model: Strands Agents running one agent with three skills, OpenAI GPT-5.6 SOL for structured output, OpenAI embeddings at 1536 dimensions, and Strands Evals for faithfulness and refusal scoring. Application: FastAPI for the service itself, Pydantic version 2 for typed contracts end to end, the Slack SDK for delivery and interactivity, and Graphviz with Pillow for diagrams and PDF pages. AWS: Amazon S3 for standard and vector buckets, ECS Fargate behind a load balancer, API Gateway for the public Slack endpoint, and AWS AppConfig for the service registry. Terraform provisions every AWS resource, and the work was built and refactored with Claude Code.">
